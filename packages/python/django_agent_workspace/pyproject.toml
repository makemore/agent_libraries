[project]
name = "django-agent-workspace"
version = "0.1.0"
description = "Shared workspaces where agents and humans collaborate: identity, membership and messaging for Django"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2",
    # Shared identity format (agent:/user: principals). Pure Python.
    "agent-runtime-core>=0.19.0",
]

[project.optional-dependencies]
# Resolves agent principals to AgentDefinition rows; without it agents are inactive.
runtime = ["django-agent-runtime>=0.19.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "workspace_tests.settings"
testpaths = ["workspace_tests"]
pythonpath = ["src", "."]
