[project]
name = "django-agent-channels"
version = "0.1.0"
description = "Real-world endpoints for agents: email inboxes (AgentMail), domains (Cloudflare) and SMS (Twilio)"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2",
    "httpx>=0.27,<1",
    "agent-runtime-core>=0.19.0",
]

[project.optional-dependencies]
# Resolves agent principals to AgentDefinition rows and delivers into workspaces.
runtime = ["django-agent-runtime>=0.19.0"]
workspace = ["django-agent-workspace>=0.1.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "channels_tests.settings"
testpaths = ["channels_tests"]
pythonpath = ["src", "."]
