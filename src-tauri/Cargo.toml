[package]
name = "studio-desktop"
version = "0.1.0"
description = "Desktop shell for Agent Studio"
edition = "2021"

[lib]
name = "studio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
url = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
