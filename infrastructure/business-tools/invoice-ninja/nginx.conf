# Adapted from the official Debian image's nginx/laravel.conf.
# Only root Caddy terminates HTTPS; there is no direct HTTP/public listener.
server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    server_tokens off;
    # Invoice/payment/reset URLs can carry credentials in paths or query strings.
    # Do not inherit the image's combined request log to stdout.
    access_log off;
    client_max_body_size 10M;
    client_body_buffer_size 10M;
    fastcgi_buffers 32 16K;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt { access_log off; log_not_found off; }
    error_page 404 /index.php;

    # Execute only the application front controller, never uploaded PHP files.
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        # Canonical external origin is HTTPS even during private setup.
        # Do not enable wildcard application trust of client-supplied headers.
        fastcgi_param HTTPS on;
        fastcgi_pass invoice-app:9000;
    }

    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}