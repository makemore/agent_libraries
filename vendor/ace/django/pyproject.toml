[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ace-django"
version = "1.0.0"
description = "Django and PostgreSQL durable execution adapter for ACE"
requires-python = ">=3.11"
license = {text = "Proprietary"}
dependencies = [
    "ace-core>=1.0.0",
    "Django>=5.2,<6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-django>=4.8",
    "pytest-randomly>=3.15",
    "pytest-socket>=0.8",
]
typecheck = ["pyright==1.1.411", "django-types>=0.20,<1.0"]

[tool.setuptools.packages.find]
include = ["ace_django*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "ace_django.tests.settings"
pythonpath = ["../ace"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-q",
    "--disable-socket",
    "--allow-unix-socket",
    "--allow-hosts=127.0.0.1,::1,localhost",
]
markers = ["postgres: requires PostgreSQL semantics and separate OS processes"]

[tool.coverage.run]
source = ["ace_django"]
omit = ["*/migrations/*", "ace_django/tests/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
