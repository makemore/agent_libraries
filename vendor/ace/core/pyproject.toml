[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ace-core"
version = "1.0.0"
description = "Pure-Python durable workflow contracts and transition engine"
requires-python = ">=3.11"
license = {text = "Proprietary"}
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-randomly>=3.15",
    "pytest-socket>=0.8",
]
typecheck = ["pyright==1.1.411"]

[tool.setuptools.packages.find]
include = ["ace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-q",
    "--disable-socket",
    "--allow-unix-socket",
    "--allow-hosts=127.0.0.1,::1,localhost",
]

[tool.coverage.run]
source = ["ace"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
